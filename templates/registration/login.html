{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · ERP v{{ erp_version }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #13263d, #1f4e79); }
    .login { width: 100%; max-width: 380px; }
  </style>
</head>
<body>
  <div class="login px-3">
    <div class="text-center text-white mb-4">
      <i class="bi bi-grid-1x2-fill fs-1"></i>
      <h1 class="h3 mt-2 mb-0">ERP <span class="opacity-75">v{{ erp_version }}</span></h1>
      <small class="opacity-75">Ventas · Compras · Inventario · Logística · Finanzas · Contabilidad</small>
    </div>
    <div class="card shadow border-0">
      <div class="card-body p-4">
        {% if form.errors %}<div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small" for="id_username">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label small" for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
    <p class="text-center text-white-50 small mt-4 mb-0">ERP v{{ erp_version }} · Creado por J. Flores</p>
  </div>
</body>
</html>
