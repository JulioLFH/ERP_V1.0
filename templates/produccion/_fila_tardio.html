<tr>
  <td><select name="tardio-{{ i }}-tipo" class="form-select form-select-sm">{% for v, t in tipos_tardio %}<option value="{{ v }}">{{ t }}</option>{% endfor %}</select></td>
  <td><select name="tardio-{{ i }}-trabajador" class="form-select form-select-sm"><option value="">—</option>{% for t in trabajadores_tardio %}<option value="{{ t.pk }}">{{ t.nombre_completo }}{% if t.fecha_cese %} (cese {{ t.fecha_cese|date:'d/m/Y' }}){% endif %}</option>{% endfor %}</select></td>
  <td><select name="tardio-{{ i }}-centro" class="form-select form-select-sm"><option value="">—</option>{% for p in puestos %}<option value="{{ p.pk }}">{{ p }}</option>{% endfor %}</select></td>
  <td><input name="tardio-{{ i }}-horas" class="form-control form-control-sm text-end" inputmode="decimal"></td>
  <td><input name="tardio-{{ i }}-importe" class="form-control form-control-sm text-end" inputmode="decimal"></td>
  <td><button type="button" class="btn btn-sm btn-link text-danger p-0" data-quitar-fila title="Quitar la fila">&times;</button></td>
</tr>
