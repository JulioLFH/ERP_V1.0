{% extends 'base.html' %}{% load erp_tags %}
{% block title %}Hoja de costos {{ lista }}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
  <h1 class="page-title"><i class="bi bi-calculator"></i> {{ lista.producto.nombre }} <small class="text-muted">{{ lista.codigo }}</small></h1>
  <a href="{% url 'costos:estandar' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Costo estándar</a>
</div>
<form class="row g-2 align-items-end mb-3" method="get">
  <div class="col-auto"><label class="form-label small mb-1">Simular cantidad ({{ lista.producto.unidad }})</label><input name="cantidad" value="{{ request.GET.cantidad }}" class="form-control form-control-sm text-end" inputmode="decimal" placeholder="{{ lista.cantidad_base }}"></div>
  <div class="col-auto"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-repeat"></i> Calcular</button></div>
</form>
<div style="max-width: 900px">{% include 'produccion/_hoja.html' %}</div>
{% endblock %}
