{% for c in celda %}{% if 'post' in c %}<form method="post"{% if c.post %} action="{{ c.post }}"{% endif %} class="d-inline"{% if c.confirmar %} data-confirm="{{ c.confirmar }}"{% endif %}>{% csrf_token %}<input type="hidden" name="{{ c.campo }}" value="{{ c.valor }}">{% for k, v in c.extra.items %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}{% if c.pedir %}<input name="{{ c.pedir.0 }}" placeholder="{{ c.pedir.1 }}" class="form-control form-control-sm d-inline-block py-0 me-1" style="width:11rem" required>{% endif %}<button class="btn btn-sm btn-outline-primary py-0">{{ c.texto }}</button></form>{% elif c.url %}<a href="{{ c.url }}" class="{{ c.clase }}">{{ c.texto }}</a>{% else %}<span class="{{ c.clase }}">{{ c.texto }}</span>{% endif %} {% endfor %}
