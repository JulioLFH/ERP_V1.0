{% extends 'base.html' %}
{% block title %}Reportes masivos de inventario{% endblock %}
{% block content %}
<h1 class="page-title mb-3"><i class="bi bi-table"></i> Reportes masivos de inventario</h1>
<div class="row g-3">
  {% for clave, r in reportes.items %}<div class="col-md-6 col-lg-4"><a href="{% url 'inventario:reporte_masivo' clave %}" class="card h-100 text-decoration-none text-reset"><div class="card-body">
    <div class="d-flex justify-content-between"><b><i class="bi {{ r.2 }}"></i> {{ r.0 }}</b><span class="badge text-bg-light border">{{ r.1 }}</span></div>
    <p class="small text-muted mb-0 mt-2">{{ r.3 }}</p>
  </div></a></div>{% endfor %}
</div>
{% endblock %}
