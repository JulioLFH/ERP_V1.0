{% load erp_tags %}{% if page_obj.has_other_pages %}
<div class="card-footer bg-white d-flex justify-content-between align-items-center small">
  <span class="text-muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} registros</span>
  <div class="btn-group btn-group-sm">
    {% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="?{% qs page=page_obj.previous_page_number %}">«</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?{% qs page=page_obj.next_page_number %}">»</a>{% endif %}
  </div>
</div>
{% endif %}
