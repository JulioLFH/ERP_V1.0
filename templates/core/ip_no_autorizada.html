<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso no autorizado · Ceiba ERP</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; color: #212529;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
    .caja { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); max-width: 460px; padding: 28px; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p { line-height: 1.5; margin: 0 0 10px; }
    code { background: #f1f3f5; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Acceso no autorizado</h1>
    <p>Esta computadora no está autorizada para usar el ERP.</p>
    <p>Su IP es <code>{{ ip }}</code>. Pídale al administrador que la permita en <b>Ajustes › IP permitidas e intentos de ingreso</b>; su intento ya quedó registrado.</p>
  </div>
</body>
</html>
