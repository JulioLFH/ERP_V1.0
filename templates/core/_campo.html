{% if field.field.widget.input_type == 'checkbox' %}
<div class="form-check mt-4">
  {{ field }} <label class="form-check-label small" for="{{ field.id_for_label }}">{{ field.label }}</label>
</div>
{% else %}
<label class="form-label small mb-1" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
{{ field }}
{% endif %}
{% if field.help_text %}<div class="form-text small">{{ field.help_text }}</div>{% endif %}
{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
