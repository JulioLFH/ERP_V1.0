{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<h1 class="page-title mb-3">Cambiar contraseña</h1>
<div class="card" style="max-width:480px"><div class="card-body">
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label small mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-control" required>
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary">Guardar</button>
  </form>
</div></div>
{% endblock %}
