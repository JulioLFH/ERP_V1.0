# Despliegue en Render (Blueprint): New + > Blueprint > seleccionar este repositorio
databases:
  - name: erp-db
    plan: free
    databaseName: erp
    user: erp

services:
  - type: web
    name: erp-v1
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn erp.wsgi --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
