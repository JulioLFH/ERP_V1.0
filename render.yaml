# Despliegue en Render (Blueprint): New + > Blueprint > seleccionar este repositorio
databases:
  - name: erp-db
    plan: free
    databaseName: erp
    user: erp

services:
  - type: web
    name: erp-v1
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn erp.wsgi --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # instalación limpia (ERP de inicio): sin demo y sin DJANGO_SUPERUSER_PASSWORD, la primera visita abre el
      # asistente /instalacion/ que registra la empresa y su administrador
      - key: SEED_DEMO
        value: "0"
      # Opcional: ruta secreta del panel de Django (sin ella no existe /admin/) e IP permitidas (coma)
      - key: ADMIN_URL
        sync: false
      - key: ADMIN_IPS
        sync: false
